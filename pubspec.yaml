name: showcase
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Cupertino icon font, used by the CupertinoIcons class.
  cupertino_icons: ^1.0.8

  flutter:
    sdk: flutter

  # Declarative animation chains (.animate().fade().slide()) — the backbone of
  # the app's motion design.
  flutter_animate: ^4.5.2

  # State management. Used for async work — live data panels, form submits —
  # not for the simple local state that core Flutter already handles well.
  flutter_riverpod: ^3.4.2

  # Real-time 3D over Flutter GPU. On web it uses its own WebGL2 backend, since
  # Impeller/Flutter GPU aren't available there. NOTE: 0.x, breaking changes
  # expected — see the block comment below before relying on it.
  flutter_scene: ^0.20.0

  # URL-based routing. On web this is what gives every page a real address,
  # a working browser back button, and shareable deep links.
  go_router: ^17.3.0

  # Vector/matrix maths for camera and transforms (used with flutter_scene).
  vector_math: ^2.2.0
  web: ^1.1.1


# ⚠️ DO NOT REMOVE — this override is load-bearing on iOS.
#
# third_party/flutter_scene is flutter_scene 0.20.0 plus two local patches:
#
#   1. Scene._presentView leaked a ui.Image every frame. On the WebGL2 backend
#      that is a fresh GPU allocation per frame (~680 MB/s at dpr 3), which
#      kills a Safari tab on iOS in about five seconds — with ANY scene, even
#      two instances. Verified fixed on a real iPhone 11.
#   2. BillboardGeometry re-uploaded its whole instance array every frame even
#      when unchanged (1.12 MB/frame at 20k). Now dirty-flagged. Worth ~1 fps.
#
# Dropping this override reintroduces the iOS crash. Full writeup and the
# measurements behind it: docs/flutter-scene-web-leak.md
dependency_overrides:
  flutter_scene:
    path: third_party/flutter_scene

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Strict lint set — see analysis_options.yaml.
  very_good_analysis: ^10.3.0

# ── Riverpod: no code generation, deliberately ────────────────────────────────
# Decided 2026-08-03. Providers are written by hand; there is no build_runner,
# no riverpod_generator/riverpod_annotation, and no .g.dart files.
#
# WHY: riverpod_generator pins riverpod_annotation exactly, which pins riverpod
# exactly — and every generator/annotation pair above riverpod 3.1.0 pulls a
# test/analyzer combination that conflicts with `flutter_test` from the Flutter
# SDK (SDK pins matcher 0.12.19 + test_api 0.7.11). So adopting codegen means
# freezing riverpod at 3.1.0.
#
# That is not a cosmetic gap. 3.3.2 fixes `Mutation.run` throwing when the
# container is disposed mid-run, and `Mutation.reset` failing to cancel
# in-flight runs — i.e. real bugs on the exact form-submit path this app needs.
# 3.4.x fixes further markNeedsBuild errors. Latest library > saved keystrokes.
#
# riverpod_lint + custom_lint are absent for a SEPARATE reason: custom_lint
# 0.8.1 needs analyzer ^8 while riverpod_lint >3.1.0 needs analyzer ^9.
#
# Revisit both once the ecosystem finishes the analyzer 9 migration.
# ──────────────────────────────────────────────────────────────────────────────

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
