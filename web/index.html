<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
        content="A procedural 3D tree, generated and rendered in the browser.">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Showcase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Showcase</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches the app background so there is no white flash before the first
       frame, and no bounce past the edges on iOS. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #07070E;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    // Bootstrap by hand rather than using the generated flutter_bootstrap.js,
    // so the service worker can be turned OFF.
    //
    // Flutter's service worker serves the CACHED build on load and fetches the
    // update in the background, so a returning visitor sees the PREVIOUS
    // version until they reload a second time. On iOS it is stickier still.
    // For a site with no offline requirement that is pure downside: it means
    // "I deployed a fix" and "you can see the fix" are different events.
    //
    // Passing no serviceWorkerSettings skips registration entirely. Cache
    // behaviour is handled by web/_headers instead, where it is explicit:
    // index.html never cached, content-hashed assets cached for a year.
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load();
  </script>
</body>
</html>
